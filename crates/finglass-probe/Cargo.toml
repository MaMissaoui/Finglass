[package]
name = "finglass-probe"
description = "Read-only FinTS feasibility probe: can fints-rs fetch balances and statements?"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "finglass-probe"
path = "src/main.rs"

[dependencies]
fints-rs = { version = "0.2", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
rpassword = "7"
secrecy = "0.10"

[lints]
workspace = true
