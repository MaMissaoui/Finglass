[package]
name = "finglass-core"
description = "Finglass logic without UI: data, imports, bank sync, reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dirs = "7"
encoding_rs = "0.8.44"
fancy-regex = "0.20"
roxmltree = "0.21.2"
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
rust_decimal = "1.43.0"
secrecy = "0.10"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
unicode-normalization = "0.1"
zeroize = "1"
zip = "9.4.1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
