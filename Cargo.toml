[workspace]
resolver = "3"
members = ["crates/finglass-core", "crates/finglass-ui", "crates/finglass", "crates/finglass-probe"]

[workspace.package]
version = "0.3.3"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/MaMissaoui/Finglass"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The generated Slint UI is one 22 MB Rust file. With the workspace's codegen-units = 1 it is optimised on a
# single core; 16 units let that crate optimise in parallel. Thin LTO still runs across the whole binary.
[profile.release.package.finglass-ui]
codegen-units = 16
