name: Security

# Vulnerability scans. Dependency changes and this file are scanned on every PR
# and push; the daily run catches advisories published after the last change. A
# red run opens (or updates) one issue, so it is not missed.
on:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
    paths:
      - "go.mod"
      - "go.sum"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Print the Go version
        shell: bash
        run: go version
      # govulncheck type-checks the packages, and with cgo on the Linux build
      # needs the same headers as portability.yml.
      - name: Install the Linux cgo, SQLCipher and Wails dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev
      # Source mode: only vulnerabilities reachable from this code fail the job.
      - name: Run govulncheck
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          check-latest: true
      # Any production finding fails; dev tooling only from high.
      - name: Audit the npm dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=high

  # The scheduled run speaks up on its own; PR and push runs are visible on the
  # commit already.
  report:
    name: Report the failure
    needs: [govulncheck, npm-audit]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Open or update the security issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Security scan failed
        shell: bash
        run: |
          set -euo pipefail

          gh label create security >/dev/null 2>&1 || true

          number=$(gh issue list --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // \"\"")

          body="The scheduled security scan failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --label security --body "$body"
          fi
