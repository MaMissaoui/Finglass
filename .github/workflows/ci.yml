name: CI

# Prose-only changes cannot break the build or the tests, so they skip CI.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS only until Finglass reaches FinDesk's functionality (minus payments). Then add back
        # ubuntu-latest and windows-latest.
        os: [macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The same script scripts/ci-local.sh runs: cargo test (only crates/finglass-probe is left).
      - name: Test
        run: bash scripts/ci/rust-test.sh

  # The Mac installer test. It used to run at the end of scripts/ci/rust-test.sh; it moved to a Go-era
  # script so it keeps running once the Rust test script is gone.
  install:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mac installer test
        run: bash scripts/ci/install-mac.sh

  # Lint runs as its own job, next to the tests rather than before them.
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The same script scripts/ci-local.sh runs: cargo fmt --check, then clippy.
      - name: Format and Clippy
        run: bash scripts/ci/rust-lint.sh

  # The Go app (docs/PLAN.md). The Test and Lint jobs above cover only crates/finglass-probe and the installer.
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Installs golangci-lint only; scripts/ci/go.sh runs it with the other checks.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      # The same script scripts/ci-local.sh runs: gofmt, go vet, golangci-lint, go test.
      - name: Go checks
        run: bash scripts/ci/go.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      # The same scripts scripts/ci-local.sh runs: svelte-check, Vitest, build, Playwright screenshots (WebKit).
      - name: Frontend checks
        run: bash scripts/ci/frontend.sh
        env:
          FINGLASS_SCREENSHOTS: ${{ runner.temp }}/screenshots
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
      # Universal, ad-hoc-signed Finglass.app with its --self-check.
      - name: Package the Go app
        run: bash scripts/ci/go-package.sh

  # The FinTS product id is a release secret. Forks and PRs without the secret skip the scan.
  secret-scan:
    name: Secret scan (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for the FinTS product id
        env:
          ID: ${{ secrets.FINGLASS_FINTS_PRODUCT_ID }}
        run: bash scripts/ci/secret-scan.sh
      # The packager's own rule, checked against the real secret so a wrong guess about its format shows up
      # here and not on a release tag. Prints only valid/invalid, never the value.
      - name: Check the FinTS product id format
        env:
          FINGLASS_FINTS_PRODUCT_ID: ${{ secrets.FINGLASS_FINTS_PRODUCT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FINGLASS_FINTS_PRODUCT_ID:-}" ]; then
            echo "product id secret not available; skipping"
            exit 0
          fi
          bash scripts/go-package-macos.sh --validate-only
